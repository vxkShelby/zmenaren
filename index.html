<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kurzový lístok – Zmenáreň OC Laugaricio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #12203A;
    --ink-soft: #4B5A72;
    --paper: #F5EFE2;
    --paper-line: #E4DAC5;
    --card: #FFFFFF;
    --lg-red: #E2231A;
    --lg-orange: #F5A623;
    --up: #1E8E5A;
    --down: #C0392B;
    --muted: #8A8172;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', Arial, sans-serif;
  }
  .board {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px 16px 28px;
  }
  .board-card {
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 16px rgba(18, 32, 58, 0.08);
  }
  .accent-bar {
    display: flex;
    height: 5px;
  }
  .accent-bar span { flex: 1; }
  .accent-bar span:first-child { background: var(--lg-red); }
  .accent-bar span:last-child { background: var(--lg-orange); }

  header {
    text-align: center;
    padding: 26px 20px 18px;
  }
  .brand-mark {
    display: block;
    margin: 0 auto 10px;
  }
  header h1 {
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 2rem;
    line-height: 1;
    margin: 0 0 6px;
    color: var(--ink);
    text-wrap: balance;
  }
  .fee-badge {
    display: inline-block;
    margin: 4px 0 10px;
    padding: 5px 14px;
    border-radius: 999px;
    background: var(--lg-red);
    color: #fff;
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 0.85rem;
  }
  header .oc-line {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-size: 0.7rem;
    color: var(--lg-red);
    margin: 0 0 10px;
  }
  header .subtitle {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .hours-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin: 2px 0 10px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .status-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px 3px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .status-pill .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .status-open { background: rgba(30, 142, 90, 0.13); color: var(--up); }
  .status-open .dot { background: var(--up); }
  .status-soon { background: rgba(245, 166, 35, 0.16); color: #8A5A12; }
  .status-soon .dot { background: var(--lg-orange); }
  .status-closed { background: rgba(18, 32, 58, 0.07); color: var(--ink-soft); }
  .status-closed .dot { background: var(--muted); }
  .status-note {
    display: block;
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .calc {
    margin: 4px 20px 20px;
    padding: 16px;
    background: rgba(18, 32, 58, 0.03);
    border: 1px solid var(--paper-line);
    border-radius: 12px;
  }
  .calc-title {
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-size: 0.75rem;
    color: var(--ink-soft);
    margin: 0 0 10px;
  }
  .calc-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .calc-toggle button {
    flex: 1;
    padding: 7px 6px;
    border-radius: 8px;
    border: 1px solid var(--paper-line);
    background: #fff;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .calc-toggle button.active {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--paper);
  }
  .calc-label {
    margin: 0 0 4px;
    font-size: 0.76rem;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .calc-row {
    display: flex;
    gap: 8px;
  }
  .calc-row input[type="number"] {
    flex: 1;
    min-width: 0;
    padding: 9px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    font-family: 'Work Sans', sans-serif;
    font-size: 1rem;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: #fff;
  }
  .calc-row select {
    padding: 9px 10px;
    border: 1px solid var(--paper-line);
    border-radius: 8px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--ink);
    background: #fff;
  }
  .calc-result {
    margin-top: 12px;
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 800;
    font-size: 1.6rem;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .calc-result .eur-label {
    font-family: 'Work Sans', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    color: var(--muted);
    margin-left: 6px;
  }
  .calc-helper {
    margin: 4px 0 0;
    font-size: 0.76rem;
    color: var(--muted);
  }
  .calc-details {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--paper-line);
    font-size: 0.78rem;
    color: var(--ink-soft);
  }
  .calc-details strong {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .table-wrap { overflow-x: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead tr {
    background: var(--ink);
  }
  thead th {
    color: var(--paper);
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 700;
    text-align: left;
    padding: 10px 14px;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  thead th.num, tbody td.num {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  tbody td {
    padding: 11px 14px;
    border-bottom: 1px solid var(--paper-line);
    font-size: 1rem;
  }
  tbody tr:last-child td {
    border-bottom: none;
  }
  tbody tr:nth-child(even) {
    background: rgba(18, 32, 58, 0.03);
  }
  .currency {
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .currency .code {
    font-family: 'Big Shoulders', sans-serif;
    font-weight: 700;
    letter-spacing: 0.02em;
    font-size: 1.02rem;
  }
  .currency .country {
    color: var(--muted);
    font-size: 0.8rem;
  }
  .buy, .sell {
    color: var(--ink);
    font-weight: 600;
  }
  .change {
    line-height: 1.55;
    font-size: 0.78rem;
  }
  .delta { white-space: nowrap; }
  .delta-up { color: var(--up); }
  .delta-down { color: var(--down); }
  .delta-flat { color: var(--muted); }

  footer {
    padding: 14px 20px 0;
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
  }
  footer .demo-badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(245, 166, 35, 0.16);
    color: #8A5A12;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .contact {
    padding: 14px 20px 22px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .contact strong { color: var(--ink); }
  .social-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 10px;
    color: var(--lg-red);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .social-link:hover { text-decoration: underline; }
  .social-link svg { width: 16px; height: 16px; fill: currentColor; }
</style>
</head>
<body>
  <div class="board">
    <div class="board-card">
      <div class="accent-bar" aria-hidden="true"><span></span><span></span></div>

      <header>
        <svg class="brand-mark" viewBox="0 0 120 120" width="52" height="52" aria-hidden="true">
          <path fill="none" stroke="var(--lg-red)" stroke-width="15" stroke-linecap="butt"
                d="M 82.1,25.6 A 42,42 0 0,0 16.2,63.7 M 4,47 L 78,47"/>
          <path fill="none" stroke="var(--lg-orange)" stroke-width="15" stroke-linecap="butt"
                d="M 16,60 A 42,42 0 0,0 82.1,94.4 M 4,73 L 78,73"/>
        </svg>
        <h1>Zmenáreň</h1>
        <p class="fee-badge" id="fee-badge">0 % poplatok za výmenu</p>
        <p class="oc-line">OC Laugaricio · Trenčín</p>
        <div class="hours-row">
          <span>PO–NE 10:00–19:00</span>
          <span class="status-pill" id="status-pill"><span class="dot"></span><span id="status-label">…</span></span>
        </div>
        <span class="status-note" id="status-note"></span>
        <p class="subtitle">Koľko cudzej meny dostanete za 1 EUR</p>
      </header>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Mena</th>
              <th class="num">Nakupujeme</th>
              <th class="num">Predávame</th>
              <th class="num">Zmena</th>
            </tr>
          </thead>
          <tbody id="rates-body">
            <!-- riadky sa vkladajú automaticky cez JS nižšie -->
          </tbody>
        </table>
      </div>

      <div class="calc">
        <p class="calc-title">Kalkulačka</p>
        <div class="calc-toggle">
          <button type="button" class="active" data-mode="buy" id="calc-mode-buy">Chcem eurá</button>
          <button type="button" data-mode="sell" id="calc-mode-sell">Chcem cudziu menu</button>
        </div>
        <p class="calc-label" id="calc-amount-label">Mám</p>
        <div class="calc-row">
          <input type="number" id="calc-amount" value="100" min="0" step="any" inputmode="decimal" aria-label="Suma">
          <select id="calc-currency" aria-label="Mena"></select>
        </div>
        <div class="calc-result"><span id="calc-output">—</span><span class="eur-label">EUR</span></div>
        <p class="calc-helper" id="calc-helper"></p>
        <div class="calc-details">
          <span>Kurz: <strong id="calc-rate-detail">—</strong></span>
          <span>Poplatok: <strong id="calc-fee-detail">—</strong></span>
        </div>
      </div>

      <footer>
        <span id="last-updated">Načítavam kurzy…</span>
      </footer>

      <div class="contact">
        <strong>OC Laugaricio</strong> · Belá, Trenčín<br>
        T: 0908 481 927
        <br>
        <a class="social-link" href="https://www.facebook.com/zmenarentrencin/" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.51 1.49-3.9 3.77-3.9 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.89h2.78l-.44 2.91h-2.34V22c4.78-.76 8.44-4.92 8.44-9.94Z"/></svg>
          Zmenáreň Trenčín na Facebooku
        </a>
      </div>
    </div>
  </div>

<script>
  // ---------------------------------------------------------------
  // KONFIGURÁCIA — doplniť po vytvorení Google Sheetu s kurzami.
  // Pokiaľ SHEET_ID ostane prázdne, stránka zobrazuje ukážkové dáta.
  // ---------------------------------------------------------------
  const CONFIG = {
    SHEET_ID: "",        // TODO: ID Google Sheetu (z jeho URL)
    SHEET_NAME: "Kurzy",  // TODO: názov hárku s kurzami
    REFRESH_INTERVAL_MS: 60000, // ako často si stránka overí nové dáta (60s)
  };

  // Poplatok navyše ku kurzu — ak sa to niekedy zmení, stačí upraviť tu
  // (a text badge v hlavičke, ten je samostatný, nech sa dá formulovať voľne).
  const FEE_PERCENT = 0;

  // ---------------------------------------------------------------
  // OTVÁRACIA DOBA — bežné hodiny (rovnaké každý deň PO–NE).
  // ---------------------------------------------------------------
  const REGULAR_HOURS = { openMin: 10 * 60, closeMin: 19 * 60 };
  const CLOSING_SOON_MIN = 30; // posledných X minút pred zatvorením = "čoskoro zatvárame"

  // Dni, kedy má OC Laugaricio zatvorené — NIE každý štátny sviatok platí,
  // dopĺňať len tie, kedy je centrum reálne zatvorené (potvrdiť s vedením OC).
  // Formát dátumu: "RRRR-MM-DD".
  const HOLIDAY_CLOSURES = [
    // { date: "2026-12-25", label: "1. sviatok vianočný" },
    // { date: "2026-01-01", label: "Nový rok" },
  ];

  // Mimoriadne/neplánované zatvorenie (napr. dovolenka, choroba) — pridaj
  // riadok s dnešným (alebo budúcim) dátumom a text sa zobrazí namiesto
  // bežného stavu. Zmaž/zakomentuj riadok, keď zase otvoríte.
  const MANUAL_CLOSURES = [
    // { date: "2026-09-05", note: "Dnes mimoriadne zatvorené" },
  ];

  function nowInTrencin() {
    const parts = new Intl.DateTimeFormat("en-CA", {
      timeZone: "Europe/Bratislava",
      year: "numeric", month: "2-digit", day: "2-digit",
      hour: "2-digit", minute: "2-digit", hour12: false,
    }).formatToParts(new Date());
    const get = (type) => parts.find(p => p.type === type).value;
    return {
      dateStr: `${get("year")}-${get("month")}-${get("day")}`,
      minutesSinceMidnight: parseInt(get("hour"), 10) * 60 + parseInt(get("minute"), 10),
    };
  }

  function formatHM(totalMin) {
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  }

  function computeStatus() {
    const { dateStr, minutesSinceMidnight } = nowInTrencin();

    const manual = MANUAL_CLOSURES.find(c => c.date === dateStr);
    if (manual) {
      return { state: "closed", label: "Zatvorené", note: manual.note };
    }
    const holiday = HOLIDAY_CLOSURES.find(h => h.date === dateStr);
    if (holiday) {
      return { state: "closed", label: "Zatvorené", note: holiday.label };
    }

    const { openMin, closeMin } = REGULAR_HOURS;
    if (minutesSinceMidnight < openMin) {
      return { state: "closed", label: "Zatvorené", note: `Otvárame o ${formatHM(openMin)}` };
    }
    if (minutesSinceMidnight >= closeMin) {
      return { state: "closed", label: "Zatvorené", note: "" };
    }
    if (minutesSinceMidnight >= closeMin - CLOSING_SOON_MIN) {
      return { state: "soon", label: "Čoskoro zatvárame", note: `Zatvárame o ${formatHM(closeMin)}` };
    }
    return { state: "open", label: "Otvorené", note: "" };
  }

  function renderStatus() {
    const status = computeStatus();
    const pill = document.getElementById("status-pill");
    pill.className = `status-pill status-${status.state}`;
    document.getElementById("status-label").textContent = status.label;
    document.getElementById("status-note").textContent = status.note || "";
  }

  // Meny, ktoré zmenáreň reálne obchoduje (základná mena je EUR).
  const COUNTRIES = {
    AUD: "Austrália", USD: "USA", CAD: "Kanada", CZK: "Česko",
    GBP: "Veľká Británia", HUF: "Maďarsko", CHF: "Švajčiarsko",
    PLN: "Poľsko", RON: "Rumunsko", BGN: "Bulharsko",
    DKK: "Dánsko", SEK: "Švédsko", NOK: "Nórsko",
  };

  // Ukážkové dáta — zobrazia sa, kým nie je napojený reálny Google Sheet.
  // Konvencia: koľko jednotiek cudzej meny dostanete za 1 EUR.
  // "Nakupujeme" je vždy vyššie číslo ako "Predávame" (zmenáreň si tak
  // necháva maržu) — presne ako v reálnom príklade: CZK 24,80 / 23,50.
  // prevBuy/prevSell = hodnoty pred poslednou zmenou kurzu (na výpočet stĺpca "Zmena").
  const DEMO_RATES = [
    { code: "AUD", buy: 1.680,  sell: 1.620,  prevBuy: 1.665,  prevSell: 1.605 },
    { code: "USD", buy: 1.100,  sell: 1.060,  prevBuy: 1.100,  prevSell: 1.060 },
    { code: "CAD", buy: 1.510,  sell: 1.450,  prevBuy: 1.525,  prevSell: 1.465 },
    { code: "CZK", buy: 24.80,  sell: 23.50,  prevBuy: 24.75,  prevSell: 23.45 },
    { code: "GBP", buy: 0.870,  sell: 0.840,  prevBuy: 0.870,  prevSell: 0.840 },
    { code: "HUF", buy: 402.0,  sell: 388.0,  prevBuy: 405.0,  prevSell: 391.0 },
    { code: "CHF", buy: 0.945,  sell: 0.915,  prevBuy: 0.938,  prevSell: 0.908 },
    { code: "PLN", buy: 4.350,  sell: 4.210,  prevBuy: 4.350,  prevSell: 4.210 },
    { code: "RON", buy: 5.050,  sell: 4.910,  prevBuy: 5.060,  prevSell: 4.920 },
    { code: "BGN", buy: 2.000,  sell: 1.865,  prevBuy: 2.000,  prevSell: 1.865 },
    { code: "DKK", buy: 7.550,  sell: 7.350,  prevBuy: 7.540,  prevSell: 7.340 },
    { code: "SEK", buy: 11.500, sell: 11.000, prevBuy: 11.550, prevSell: 11.050 },
    { code: "NOK", buy: 11.700, sell: 11.200, prevBuy: 11.680, prevSell: 11.180 },
  ];

  function formatNumber(n) {
    const num = Number(n);
    if (Number.isNaN(num)) return "—";
    return num.toLocaleString("sk-SK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function renderDelta(current, previous) {
    const cur = Number(current);
    const prev = Number(previous);
    if (Number.isNaN(cur) || Number.isNaN(prev) || prev === 0) {
      return '<span class="delta delta-flat">–</span>';
    }
    const diff = cur - prev;
    if (Math.abs(diff) < 0.0005) {
      return '<span class="delta delta-flat">–</span>';
    }
    const arrow = diff > 0 ? "▲" : "▼";
    const cls = diff > 0 ? "delta-up" : "delta-down";
    const sign = diff > 0 ? "+" : "";
    const value = sign + diff.toLocaleString("sk-SK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return `<span class="delta ${cls}">${arrow} ${value}</span>`;
  }

  // Posledné načítané kurzy — kalkulačka nižšie z nich vždy počíta.
  let latestRates = [];

  function renderRates(rates, isDemo) {
    latestRates = rates;
    const body = document.getElementById("rates-body");
    body.innerHTML = "";
    rates.forEach(r => {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>
          <span class="currency">
            <span class="code">${r.code}</span>
            <span class="country">${COUNTRIES[r.code] || ""}</span>
          </span>
        </td>
        <td class="num buy">${formatNumber(r.buy)}</td>
        <td class="num sell">${formatNumber(r.sell)}</td>
        <td class="num change">
          ${renderDelta(r.buy, r.prevBuy)}<br>
          ${renderDelta(r.sell, r.prevSell)}
        </td>
      `;
      body.appendChild(tr);
    });

    const now = new Date().toLocaleString("sk-SK");
    const badge = isDemo ? '<span class="demo-badge">ukážkové dáta</span>' : "";
    document.getElementById("last-updated").innerHTML =
      `Aktualizované: ${now}${badge}`;

    populateCalcCurrencies();
    updateCalculator();
  }

  // ---------------------------------------------------------------
  // KALKULAČKA — počíta z latestRates (rovnaké dáta ako tabuľka).
  // ---------------------------------------------------------------
  function populateCalcCurrencies() {
    const select = document.getElementById("calc-currency");
    const prevValue = select.value;
    select.innerHTML = latestRates
      .map(r => `<option value="${r.code}">${r.code} — ${COUNTRIES[r.code] || ""}</option>`)
      .join("");
    if (latestRates.some(r => r.code === prevValue)) {
      select.value = prevValue;
    }
  }

  function updateCalculator() {
    const amount = parseFloat(document.getElementById("calc-amount").value);
    const code = document.getElementById("calc-currency").value;
    const mode = document.querySelector(".calc-toggle button.active")?.dataset.mode || "buy";
    const rate = latestRates.find(r => r.code === code);
    const output = document.getElementById("calc-output");
    const helper = document.getElementById("calc-helper");
    const rateDetail = document.getElementById("calc-rate-detail");
    const feeDetail = document.getElementById("calc-fee-detail");

    // "Chcem eurá" → zadávate sumu, ktorú MÁTE v cudzej mene.
    // "Chcem cudziu menu" → zadávate sumu, ktorú CHCETE dostať v cudzej mene.
    document.getElementById("calc-amount-label").textContent = mode === "buy" ? "Mám" : "Chcem";

    feeDetail.textContent = `${FEE_PERCENT} %`;

    if (!rate || Number.isNaN(amount) || amount < 0) {
      output.textContent = "—";
      helper.textContent = "";
      rateDetail.textContent = "—";
      return;
    }

    let eur;
    if (mode === "buy") {
      eur = amount / rate.buy;
      helper.textContent = `Toľko EUR dostanete za ${formatNumber(amount)} ${code}.`;
      rateDetail.textContent = `1 EUR = ${formatNumber(rate.buy)} ${code}`;
    } else {
      eur = amount / rate.sell;
      helper.textContent = `Toľko EUR zaplatíte za ${formatNumber(amount)} ${code}.`;
      rateDetail.textContent = `1 EUR = ${formatNumber(rate.sell)} ${code}`;
    }
    output.textContent = eur.toLocaleString("sk-SK", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  document.getElementById("calc-amount").addEventListener("input", updateCalculator);
  document.getElementById("calc-currency").addEventListener("change", updateCalculator);
  document.querySelectorAll(".calc-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".calc-toggle button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      updateCalculator();
    });
  });

  async function fetchRates() {
    if (!CONFIG.SHEET_ID) {
      renderRates(DEMO_RATES, true);
      return;
    }
    try {
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
      const res = await fetch(url, { cache: "no-store" });
      const text = await res.text();
      const jsonText = text.substring(text.indexOf("(") + 1, text.lastIndexOf(")"));
      const data = JSON.parse(jsonText);

      // Očakávaný formát riadkov v hárku:
      // Mena | Nakupujeme | Predávame | Nakup. predch. | Predaj predch.
      // (koľko jednotiek cudzej meny dostanete za 1 EUR; posledné dva stĺpce
      // sú hodnoty pred poslednou zmenou kurzu, na výpočet stĺpca "Zmena")
      const rates = data.table.rows
        .map(row => ({
          code: row.c[0]?.v,
          buy: row.c[1]?.v,
          sell: row.c[2]?.v,
          prevBuy: row.c[3]?.v,
          prevSell: row.c[4]?.v,
        }))
        .filter(r => r.code);

      renderRates(rates.length ? rates : DEMO_RATES, rates.length === 0);
    } catch (err) {
      console.error("Nepodarilo sa načítať kurzy z Google Sheetu:", err);
      renderRates(DEMO_RATES, true);
    }
  }

  fetchRates();
  setInterval(fetchRates, CONFIG.REFRESH_INTERVAL_MS);

  renderStatus();
  setInterval(renderStatus, 30000); // stav (Otvorené/Zatvorené) sa prekontroluje každých 30s
</script>
</body>
</html>
